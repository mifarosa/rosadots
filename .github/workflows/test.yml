name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # The online server has its own dependencies and end-to-end tests.
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: npm run typecheck
        working-directory: server
