name: iOS TestFlight

on:
  # Run manually from the Actions tab.
  workflow_dispatch:
  # Or push a tag like v0.1.0 to build and ship to TestFlight.
  push:
    tags:
      - 'v*'

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail fast before spending an EAS build.
      - run: npx tsx game.test.ts
      - run: npx tsc --noEmit

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # EAS builds on its own macOS workers; this step waits for the build.
      - name: Build iOS app
        id: build
        run: |
          eas build --platform ios --profile production --non-interactive --json > build.json
          echo "id=$(jq -r '.[0].id' build.json)" >> "$GITHUB_OUTPUT"

      # The App Store Connect API key lives in GitHub secrets. Write it to a
      # temp file and patch eas.json at runtime so nothing sensitive is committed.
      - name: Submit to TestFlight
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          jq --arg p "$KEY_PATH" --arg k "$ASC_KEY_ID" --arg i "$ASC_ISSUER_ID" --arg a "$ASC_APP_ID" \
            '.submit.production.ios = {ascApiKeyPath: $p, ascApiKeyId: $k, ascApiKeyIssuerId: $i, ascAppId: $a}' \
            eas.json > eas.tmp && mv eas.tmp eas.json
          eas submit --platform ios --profile production --id "${{ steps.build.outputs.id }}" --non-interactive
          rm -f "$KEY_PATH"
